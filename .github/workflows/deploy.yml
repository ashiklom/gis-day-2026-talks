name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only needed for `slidev export`, not `slidev build`
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "*/package-lock.json"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build decks
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          for deck in new-haven-lunch cloud-native-geospatial; do
            (
              cd "$deck"
              npm ci
              # Hash routing so reloads/deep links work in a Pages subdirectory
              npx slidev build \
                --base "$BASE_PATH/$deck/" \
                --router-mode hash \
                --out "../_site/$deck"
            )
          done

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
